*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--breu);color:var(--papel);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  display:grid;place-items:center;text-align:center;padding:2rem 1.5rem;
  overflow:hidden;position:relative;
}
/* luz em movimento, igual à da LP */
body::before{
  content:"";position:absolute;inset:-30% -15%;pointer-events:none;
  background:
    radial-gradient(48% 42% at 24% 18%,rgba(26,78,196,.55),transparent 70%),
    radial-gradient(40% 36% at 78% 76%,rgba(62,118,238,.3),transparent 72%);
  animation:aurora 22s ease-in-out infinite alternate;
}
@keyframes aurora{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.12)}}
/* grão */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");
}

.caixa{position:relative;z-index:2;max-width:34rem}
.brasao{
  width:74px;height:78px;margin:0 auto 1.6rem;
  background:var(--brasao) center/contain no-repeat;
}
h1{
  font-family:"Fraunces",Georgia,serif;font-optical-sizing:auto;
  font-size:clamp(1.6rem,4.6vw,2.4rem);font-weight:700;
  line-height:1.08;letter-spacing:-.012em;margin:0;
}
.sub{
  margin:1rem auto 0;max-width:36ch;
  color:rgba(223,225,224,.72);font-size:1.02rem;line-height:1.55;
}
.barra{margin:2.2rem auto 0;width:min(320px,78vw);height:2px;background:rgba(223,225,224,.2);overflow:hidden;border-radius:2px}
.barra i{display:block;height:100%;width:0;background:var(--azul-claro);transition:width 3s linear}
.barra.on i{width:100%}
.alt{margin-top:1.7rem;font-size:.86rem;color:rgba(223,225,224,.5)}
.alt a{color:var(--azul-claro)}
.zap{
  display:inline-flex;align-items:center;gap:.6rem;margin-top:1.7rem;
  background:var(--wa);color:#fff;text-decoration:none;
  border-radius:9px;padding:.9rem 1.5rem;font-weight:700;font-size:1rem;
  opacity:0;transform:translateY(10px);
  transition:opacity .5s var(--ease),transform .5s var(--ease),background .25s;
}
.zap.on{opacity:1;transform:none}
.zap:hover{background:#17803F}
.zap svg{width:21px;height:21px;fill:currentColor}
.rodape{
  position:absolute;bottom:1.4rem;left:0;right:0;z-index:2;
  font-size:.72rem;color:rgba(223,225,224,.35);
}
@media(prefers-reduced-motion:reduce){
  body::before{animation:none}
  .barra i{transition:none;width:100%}
  .zap{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="caixa">
  <div class="brasao" role="img" aria-label="Brasão Padilha &amp; Padilha"></div>
  <h1 id="titulo">Estamos abrindo o WhatsApp</h1>
  <p class="sub" id="sub">Sua conversa com a equipe do Padilha &amp; Padilha começa em instantes.</p>

  <div class="barra" id="barra" aria-hidden="true"><i></i></div>

  <a class="zap" id="zap" href="#" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm5.5 12.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.6.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.6-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.2-.6-1.5-.9-2.1-.2-.5-.4-.4-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 5 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg>
    Continuar no WhatsApp
  </a>

  <p class="alt">Se a conversa não abrir sozinha, <a href="#" id="alt-link">toque aqui</a>.</p>
</div>

<p class="rodape">Padilha e Padilha Advogados Associados — Direito Trabalhista, Salvador/BA</p>

<script>
/* ===========================================================================
   CONFIG — PREENCHER ANTES DE PUBLICAR
   =========================================================================== */
const CONFIG = {
  /* WhatsApp Business da campanha, só dígitos, com 55 + DDD: */
  whatsapp: "5571997168448",
  /* mensagem enviada ao abrir a conversa ({nome} seria trocado pelo nome do form): */
  mensagem: "Vim do Google e quero falar com um advogado especialista.",
  espera: 3000
};

/* === TAGS DE CONVERSÃO — cole aqui o snippet do Google Ads / Meta ===
   Esta página só carrega depois do formulário enviado, então é o ponto
   certo para registrar a conversão.
   Exemplo:  gtag('event','conversion',{send_to:'AW-XXXXXXXX/XXXXXXXX'});
   =================================================================== */
try{
  if (window.dataLayer) window.dataLayer.push({event:"lead_redirect"});
  if (typeof fbq === "function") fbq("track", "Lead");
}catch(e){}

const params = new URLSearchParams(location.search);
const nome = (params.get("nome") || "").trim().slice(0, 60);

if (nome){
  document.getElementById("titulo").textContent = nome.split(" ")[0] + ", estamos abrindo o WhatsApp";
}

const texto = CONFIG.mensagem.replace("{nome}", nome || "—");
const destino = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(texto);

document.getElementById("zap").href = destino;
document.getElementById("alt-link").href = destino;

requestAnimationFrame(() => {
  document.getElementById("barra").classList.add("on");
  document.getElementById("zap").classList.add("on");
});

setTimeout(() => { window.location.href = destino; }, CONFIG.espera);
</script>
</body>
</html>
